<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>μ 扫描动画 · postGW 谱函数</title>
<style>
:root{--bg:#0f1115;--panel:#161a22;--panel2:#1c2230;--line:#262d3d;--fg:#e6e9ef;
  --dim:#98a2b6;--acc:#4ea1ff;--ok:#3ddc97;--warn:#ffb020;--bad:#ff6b6b;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px;margin-bottom:12px}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button{background:var(--acc);color:#08131f;border:0;border-radius:8px;
  padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
button.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  font-weight:500}
button:hover{filter:brightness(1.12)}
input[type=range]{flex:1;min-width:220px;accent-color:var(--acc)}
.lbl{font-family:var(--mono);font-size:13px;min-width:150px}
.figbox{background:#fff;border-radius:8px;padding:6px;text-align:center;overflow-x:auto}
.figbox img{max-width:100%;height:auto;display:block;margin:0 auto}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.b-ok{background:#0f3b2c;color:var(--ok)} .b-bad{background:#3d1a1d;color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right;
  font-family:var(--mono)}
th{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
td:first-child,th:first-child{text-align:left}
tr.cur{background:#12324f}
tr.cur td{color:#cfe6ff;font-weight:600}
tr.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:var(--dim)} .kv dd{margin:0;font-family:var(--mono)}
.note{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:8px}
.spd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
</style>
</head>

let cur=0, playing=false, timer=null;
const $=id=>document.getElementById(id);
// ⚠️ 这里曾因嵌套三元少一个闭合括号（`?(cond?A:B:C`）导致整个 <script> 段
//   SyntaxError: Unexpected token ':' ⇒ **player.html 的 JS 完全不执行**，
//   动画一帧都不动（表现像"图片没加载"，实为脚本没跑）。
//   改写为显式 if/return 函数体，避免再数错括号。
function fmt(v){
  if(v===null||v===undefined) return '—';
  if(typeof v!=='number') return String(v);
  const a=Math.abs(v);
  if(a!==0&&(a<1e-3||a>=1e6)) return v.toExponential(3);
  return String(+v.toFixed(8));
}

function init(){
  $('sub').textContent=`共 ${FRAMES.length} 帧 · μ 从 ${FRAMES[0].mu} 到 `
    +`${FRAMES[FRAMES.length-1].mu} · L=${PARAMS.L} β=${PARAMS.beta} U=${PARAMS.U}`
    +(PARAMS.tp?` t′=${PARAMS.tp}`:'')+(PARAMS.tpp?` t″=${PARAMS.tpp}`:'');
  $('selfcontain').textContent=EMBEDDED
    ? '帧图已内嵌，本文件自包含，可单独复制/交付到任何位置播放'
    : '帧图用相对路径 frames/，本页须与 frames/ 同目录才能播放';
  const s=$('slider'); s.max=FRAMES.length-1; s.value=0;
  s.oninput=()=>{stop();show(+s.value)};
  $('fps').value=String(FPS0);
  $('fps').onchange=()=>{if(playing){stop();play()}};
  $('play').onclick=()=>playing?stop():play();
  $('prev').onclick=()=>{stop();show((cur-1+FRAMES.length)%FRAMES.length)};
  $('next').onclick=()=>{stop();show((cur+1)%FRAMES.length)};
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault()}
    else if(e.key==='ArrowRight'){$('next').click();e.preventDefault()}
    else if(e.key===' '){$('play').click();e.preventDefault()}});
  // 参数表
  $('pkv').innerHTML=Object.entries(PARAMS).map(([k,v])=>
    `<dt>${k}</dt><dd>${fmt(v)}</dd>`).join('');
  buildTable();
  // 预载：仅相对路径模式需要（data URI 已内联在 HTML 里，无需预载）
  if(!EMBEDDED) FRAMES.forEach(f=>{const im=new Image();im.src=f.img});
  show(0);
  // 门禁总览
  const bad=FRAMES.filter(f=>f.ndiv!==0);
  const sr=FRAMES.map(f=>f.sumrule).filter(x=>x!==null&&x!==undefined);
  $('gate').innerHTML=`<b>扫描级自检：</b> ndiv≠0 的帧 ${bad.length} 个`
    +(bad.length?`（μ=${bad.map(b=>b.mu).join(', ')}）——这些帧数据物理上不可用，已标红`:'（全部真收敛 ✅）')
    +` ｜ 谱重 ∫A dω 范围 ${sr.length?Math.min(...sr).toFixed(4)+'–'+Math.max(...sr).toFixed(4):'—'}（应≈1）`
    +` ｜ n_post 单调性 ${checkMono()}`;
  buildTable();
}
function checkMono(){
  const n=FRAMES.map(f=>f.n_post).filter(x=>x!==null&&x!==undefined);
  let bad=0; for(let i=1;i<n.length;i++) if(n[i]<n[i-1]-1e-9) bad++;
  return bad===0?'✅ 随 μ 单调递增':`❌ ${bad} 处违反单调`;
}
function buildTable(){
  const head=['μ','n_post','ndiv','顶点残差','谱重∫A','DOS(0)','∫DOS','费米面峰值'];
  let h='<tr>'+head.map(x=>`<th>${x}</th>`).join('')+'</tr>';
  FRAMES.forEach((f,i)=>{
    const cls=(f.ndiv!==0?'bad':'')+(i===cur?' cur':'');
    h+=`<tr class="${cls}" onclick="stop();show(${i})" style="cursor:pointer">`
      +`<td>${f.mu.toFixed(4)}</td><td>${fmt(f.n_post)}</td><td>${f.ndiv}</td>`
      +`<td>—</td><td>${fmt(f.sumrule)}</td><td>${fmt(f.dos0)}</td>`
      +`<td>${fmt(f.dos_int)}</td><td>${fmt(f.fs_max)}</td></tr>`;
  });
  $('tbl').innerHTML=h;
}
function show(i){
  cur=i; const f=FRAMES[i];
  $('slider').value=i;
  $('lbl').innerHTML=`μ = <b>${f.mu.toFixed(4)}</b> &nbsp; 帧 ${i+1}/${FRAMES.length}`;
  // ⚠️ data: URI（自包含模式）不能拼 ?t= 查询串，否则整串被当成 base64 内容
  //    而加载失败；只有相对路径形态才需要防缓存参数。
  const isData=f.img.startsWith('data:');
  $('figbox').innerHTML=`<img src="${f.img}${isData?'':'?t='+Date.now()}" alt="μ=${f.mu}">`;
  const kv=[['μ',f.mu.toFixed(6)],['n_post',fmt(f.n_post)],
    ['ndiv（必须 0）',f.ndiv],['谱重 ∫A dω',fmt(f.sumrule)],
    ['DOS(ω=0)',fmt(f.dos0)],['∫DOS dω',fmt(f.dos_int)],
    ['费米面峰值 A(k,0)max',fmt(f.fs_max)],['延拓失败 k 点',f.n_fail],
    ['Re G 路径',f.reG||'—'],['Fig A 取样',f.sampling||'—'],
    ['本帧耗时',f.wall?f.wall.toFixed(1)+' s':'—']];
  $('kv').innerHTML=kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')
    +(f.ndiv!==0?`<div class="note" style="grid-column:1/-1;color:var(--bad)">
      ⚠️ 本帧 ndiv=${f.ndiv}≠0：有裸泡退回，G 数据在物理上不可用，
      该帧仅供排查，不应作为结论依据。</div>`:'');
  buildTable();
}
function play(){playing=true;$('play').textContent='⏸ 暂停';
  const f=parseInt($('fps').value,10)||3;
  timer=setInterval(()=>show((cur+1)%FRAMES.length),Math.round(1000/f));}
function stop(){playing=false;$('play').textContent='▶ 播放';
  if(timer){clearInterval(timer);timer=null}}
init();
</script>
