<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>APS 四联图画廊 · postGW 谱函数工作台</title>
<style>
:root{--bg:#0f1115;--panel:#161a22;--line:#262d3d;--fg:#e6e9ef;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:26px 22px 60px}
h1{font-size:19px;font-weight:600}
.sub{color:var(--dim);font-size:12.5px}
figure{margin:34px 0}
figure img{width:100%;border:1px solid var(--line);border-radius:10px;
  background:#fff}
figcaption{font-size:13px;color:var(--dim);margin-top:9px}
figcaption b{color:var(--fg);font-weight:600}
a{color:var(--acc)}
.pdf{display:inline-block;margin-left:10px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
